<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Listing Details | UIU Books</title>
	<link rel="stylesheet" href="buyer.css">
	<link rel="stylesheet" href="workflow.css">
	<link rel="stylesheet" href="marketplace.css">
	<script defer src="auth.js?v=20261002-auth-v8"></script>
	<script defer src="marketplace-detail.js?v=20261002-market-v1"></script>
</head>
<body>
	<nav><a class="brand" href="guest-home.html">UIU Books <small>Marketplace</small></a><a href="browse.html">Back to browse</a></nav>
	<main class="shell">
		<div id="listingDetailsLoading" class="workflow-loading">Loading listing…</div>
		<div id="listingDetailsError" class="workflow-alert workflow-error" role="alert" hidden></div>
		<section id="listingDetailsContent" class="panel detail-grid" hidden>
			<img id="listingDetailImage" alt="Listing cover" hidden>
			<div>
				<span id="listingDetailMeta" class="tag"></span>
				<h1 id="listingDetailTitle">Listing</h1>
				<p id="listingDetailAuthor"></p>
				<p id="listingDetailDescription"></p>
				<h2 id="listingDetailPrice"></h2>
				<p><strong>Seller:</strong> <span id="listingDetailSeller"></span> · <span id="listingDetailRating"></span></p>
				<p id="listingActionNote" class="workflow-muted" hidden></p>
				<div id="listingActionError" class="workflow-alert workflow-error" role="alert" hidden></div>
				<div class="workflow-actions">
					<a id="listingRequestLink" class="primary" href="#">Send buy request</a>
					<button id="listingWishlistButton" class="secondary" type="button">Save to wishlist</button>
					<a id="listingMessageLink" class="secondary" href="#" hidden>Message seller</a>
				</div>
			</div>
		</section>
	</main>
</body>
</html>

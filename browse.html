<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Browse Books | UIU Books</title>
	<link rel="stylesheet" href="guest.css">
	<link rel="stylesheet" href="marketplace.css">
	<script defer src="guest.js?v=20261002-market-v2"></script>
</head>
<body>
	<nav><a class="brand" href="guest-home.html">UIU Books <small>Marketplace</small></a><a class="outline" href="index.html">Sign in to buy</a></nav>
	<main class="browse-shell">
		<header class="browse-head">
			<div><span class="pill">GUEST BROWSE</span><h1>Find your next textbook</h1><p class="muted">Search books and course materials currently approved for the marketplace.</p></div>
		</header>
		<section class="layout marketplace-layout">
			<aside class="panel filters marketplace-filters">
				<h2>Filters</h2>
				<form id="filtersForm">
					<label for="search">Search</label>
					<input id="search" class="search" type="search" maxlength="100" placeholder="Title, author, course or subject">
					<label for="department">Department</label>
					<select id="department"><option value="">All departments</option></select>
					<label for="subject">Subject</label>
					<select id="subject"><option value="">All subjects</option></select>
					<label for="categoryId">Category record</label>
					<select id="categoryId"><option value="">All categories</option></select>
					<label for="itemType">Item type</label>
					<select id="itemType"><option value="">All types</option></select>
					<label for="condition">Condition</label>
					<select id="condition"><option value="">All conditions</option></select>
					<div class="marketplace-price-fields">
						<label for="minPrice">Min price (BDT)<input id="minPrice" type="number" min="0" max="99999999.99" step="0.01"></label>
						<label for="maxPrice">Max price (BDT)<input id="maxPrice" type="number" min="0" max="99999999.99" step="0.01"></label>
					</div>
					<label for="sort">Sort by</label>
					<select id="sort"><option value="created_at">Recently added</option><option value="price">Price</option><option value="title">Title</option></select>
					<label for="direction">Order</label>
					<select id="direction"><option value="desc">Descending</option><option value="asc">Ascending</option></select>
					<div class="marketplace-filter-actions"><button class="primary" type="submit">Apply filters</button><button id="resetFilters" class="secondary" type="button">Reset</button></div>
				</form>
				<div id="filtersError" class="marketplace-error" role="alert" hidden></div>
			</aside>
			<section class="marketplace-results" aria-label="Available listings">
				<div class="marketplace-results-heading"><p id="resultCount" aria-live="polite">Browse available listings</p><label for="perPage">Per page<select id="perPage"><option value="12">12</option><option value="20" selected>20</option><option value="40">40</option></select></label></div>
				<div id="resultsLoading" class="marketplace-loading" role="status" hidden>Loading listings…</div>
				<div id="resultsError" class="marketplace-error" role="alert" hidden></div>
				<div id="resultsEmpty" class="marketplace-empty" hidden>No available listings match these filters.</div>
				<div id="bookGrid" class="grid marketplace-grid"></div>
				<nav id="pagination" class="marketplace-pagination" aria-label="Listing pages" hidden></nav>
			</section>
		</section>
	</main>
</body>
</html>

name: Marketplace checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/tashin-marketplace]

permissions:
  contents: read

jobs:
  marketplace:
    name: Marketplace syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check marketplace JavaScript syntax
        run: |
          node --check app.js
          node --check frontend-integration.js
          node --check guest.js
          node --check tests/guest_marketplace_test.js
          node --check api-integration.js
          node --check tests/marketplace_ui_test.js
      - name: Run marketplace regression tests without a database
        run: |
          node tests/marketplace_ui_test.js
          node tests/guest_marketplace_test.js
      - name: Lint marketplace PHP without executing endpoints
        run: |
          for file in api/marketplace/*.php tests/marketplace_test.php; do
            php -l "$file" || exit 1
          done

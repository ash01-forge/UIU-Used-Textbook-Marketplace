<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller Login | UIU Books</title>
  <link rel="stylesheet" href="seller.css">
  <script defer src="auth.js?v=20261001-auth-v5"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html">UIU Books <span>Marketplace</span></a>
    <p class="eyebrow">SELLER PORTAL</p>
    <h1>Welcome back</h1>
    <p>Sign in with your UIU email to manage listings and sales.</p>
    <form id="loginForm">
      <label>UIU email<input name="email" type="email" autocomplete="username" placeholder="seller@uiu.ac.bd" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <a class="secondary" href="register.html">Create a buyer or seller account</a>
  </main>
</body>
</html>

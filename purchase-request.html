<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Purchase Request | UIU Books</title>
	<link rel="stylesheet" href="buyer.css">
	<link rel="stylesheet" href="workflow.css">
	<script defer src="auth.js?v=20261002-auth-v7"></script>
	<script defer src="buyer.js?v=20261002-buyer-v1"></script>
	<style>body[data-auth-checking] main{visibility:hidden}</style>
</head>
<body data-auth-checking>
	<nav><a class="brand" href="buyer-dashboard.html">UIU Books <small>Marketplace</small></a><a href="buyer-dashboard.html">Back to dashboard</a></nav>
	<main class="shell">
		<form id="purchaseForm" class="form-card">
			<p class="eyebrow">BUY REQUEST</p>
			<h1>Request a listing</h1>
			<p id="purchaseListingTitle">Loading listing…</p>
			<strong id="purchaseListingPrice"></strong>
			<div id="purchaseError" class="workflow-alert workflow-error" role="alert" hidden></div>
			<div id="purchaseSuccess" class="workflow-alert workflow-success" role="status" hidden></div>
			<label>Meeting place
				<select id="meeting" required>
					<option value="UIU Main Gate">UIU Main Gate</option>
					<option value="UIU Library">UIU Library</option>
					<option value="UIU Cafeteria">UIU Cafeteria</option>
				</select>
			</label>
			<label>Preferred date<input id="date" type="date" required></label>
			<p class="workflow-muted">Payment: Cash on Meet</p>
			<label>Message to seller<textarea id="note" maxlength="1000" placeholder="Add a note for the seller (optional)."></textarea></label>
			<button id="purchaseSubmit" class="primary" type="submit">Send request</button>
		</form>
	</main>
</body>
</html>
